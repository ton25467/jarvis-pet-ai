<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion Center</title>
    <style>
        body { background-color: #f4f7f6; color: #2c3e50; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding-top: 50px; margin: 0; min-height: 100vh; }
        h1 { font-size: 32px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; color: #2c3e50; }
        p.subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 40px; letter-spacing: 1px; }
        .nav-link { display: inline-block; margin-bottom: 30px; color: #3498db; text-decoration: none; padding: 8px 20px; border: 1px solid #3498db; border-radius: 20px; font-size: 14px; transition: all 0.3s; }
        .nav-link:hover { background: #3498db; color: #fff; }
        button { width: 180px; height: 180px; border-radius: 50%; background: #fff; border: 4px solid #3498db; color: #3498db; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(52, 152, 219, 0.2); transition: all 0.3s ease-in-out; display: block; margin: 0 auto; }
        button:hover { box-shadow: 0 15px 30px rgba(52, 152, 219, 0.4); transform: translateY(-5px); }
        button:active { transform: scale(0.95); }
        .listening { background: #3498db; color: #fff; box-shadow: 0 0 40px rgba(52, 152, 219, 0.6); animation: pulse 1.5s infinite; border: none; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 20px rgba(52,152,219,0.5); } 50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(52,152,219,0.8); } 100% { transform: scale(1); box-shadow: 0 0 20px rgba(52,152,219,0.5); } }
        #status { margin-top: 30px; font-size: 1.2em; min-height: 30px; color: #e67e22; font-weight: bold; }
        #transcript { margin: 20px auto; max-width: 400px; min-height: 60px; font-size: 18px; color: #34495e; text-align: center; word-wrap: break-word; padding: 15px; border: 2px dashed #bdc3c7; border-radius: 10px; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        form { margin-top: 20px; }
        input[type="text"] { width: 70%; max-width: 300px; padding: 12px; font-size: 16px; border: 1px solid #bdc3c7; border-radius: 20px; background: #fff; color: #2c3e50; font-family: inherit; }
        input[type="text"]:focus { outline: none; border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.3); }
        input[type="submit"] { padding: 12px 20px; font-size: 16px; border: 1px solid #3498db; background: #3498db; color: #fff; cursor: pointer; border-radius: 20px; font-family: inherit; transition: 0.3s; }
        input[type="submit"]:hover { background: #2980b9; }
        #sending { display: none; font-size: 18px; color: #3498db; margin: 20px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <a href="/control" class="nav-link">📱 แผงควบคุม (Control Panel)</a>
    <h1>Smart AI Pet</h1>
    <p class="subtitle">ระบบผู้ช่วยอัจฉริยะ (Online)</p>
    
    <button id="micBtn" onclick="toggleMic()">🎤<br><br>กดเพื่อพูด</button>
    <div id="status">SYSTEM READY. AWAITING COMMAND...</div>
    <div id="transcript"></div>
    <div id="sending">UPLOADING DIRECTIVE...</div>
    
    <form action="/ui_chat" method="POST" id="chatForm" onsubmit="event.preventDefault(); sendMsg(document.getElementById('msgInput').value);">
        <input type="text" name="message" id="msgInput" placeholder="> Override input...">
        <input type="submit" value="SEND">
    </form>

    <script>
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.lang = 'th-TH'; // เปลี่ยนเป็น en-US ได้
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onresult = function(e) {
                let final = '', interim = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }
                document.getElementById('transcript').innerText = final || interim;
                if (final) {
                    document.getElementById('msgInput').value = final;
                    stopMic();
                    sendMsg(final);
                }
            };
            recognition.onerror = function(e) { document.getElementById('status').innerText = 'ERROR: ' + e.error; stopMic(); };
            recognition.onend = function() { stopMic(); };
        } else {
            document.getElementById('status').innerText = 'SYSTEM WARNING: SPEECH MODULE NOT SUPPORTED.';
            document.getElementById('micBtn').style.display = 'none';
        }

        function toggleMic() { if (isListening) { recognition.stop(); stopMic(); } else { recognition.start(); startMic(); } }
        function startMic() {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('micBtn').innerHTML = '[ RECORDING ]<br><br>SPEAK NOW';
            document.getElementById('status').innerText = 'LISTENING...';
            document.getElementById('transcript').innerText = '';
        }
        function stopMic() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
            document.getElementById('micBtn').innerHTML = '[ INITIATE ]<br><br>TAP TO SPEAK';
            document.getElementById('status').innerText = 'PROCESSING...';
        }
        function sendMsg(text) {
            document.getElementById('sending').style.display = 'block';
            document.getElementById('chatForm').style.display = 'none';
            document.getElementById('micBtn').style.display = 'none';
            document.getElementById('status').innerText = 'DIRECTIVE SENT. AWAITING AI RESPONSE...';
            let form = new FormData();
            form.append('message', text);
            fetch('/ui_chat', {method:'POST', body: new URLSearchParams(form)})
                .then(res => res.text())
                .then(text => {
                    if (text.startsWith("OPEN:")) {
                        let url = text.substring(5);
                        let iframe = document.createElement("iframe");
                        iframe.style.display = "none";
                        iframe.src = url;
                        document.body.appendChild(iframe);
                        setTimeout(() => document.body.removeChild(iframe), 2000);
                    }
                    setTimeout(() => {
                        document.getElementById('sending').style.display = 'none';
                        document.getElementById('chatForm').style.display = 'block';
                        document.getElementById('micBtn').style.display = 'block';
                        document.getElementById('msgInput').value = '';
                        document.getElementById('status').innerText = 'SYSTEM READY. AWAITING COMMAND...';
                    }, 1000);
                })
                .catch(()=>{ location.reload(); });
        }
    </script>
</body>
</html>
